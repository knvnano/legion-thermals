name: Bug report
description: Report a behavior or compatibility problem.
body:
  - type: markdown
    attributes:
      value: "Review diagnostics before sharing. Do not attach private paths, SID values, credentials or raw firmware dumps."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Machine type and BIOS version
      placeholder: Lenovo 83DF / N0CN32WW
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include steps to reproduce and relevant redacted errors.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows version and other fan-control software
